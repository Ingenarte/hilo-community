name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Don't run two workflows for the same branch in parallel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate SvelteKit types
        run: pnpm exec svelte-kit sync

      - name: Typecheck (svelte-check)
        run: pnpm exec svelte-check --threshold error

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Production build
        env:
          # Minimum env for build-time validation. Real values come from
          # secrets at deploy time.
          PUBLIC_BASE_URL: http://localhost:3000
          PUBLIC_BRAND: Hilo
          ADMIN_EMAIL: ci@example.com
          AUTH_FIXED_PASSWORD: 1234
          SESSION_SECRET: ci-only-not-secret-very-long-placeholder-string
          SMTP_USER: ci@example.com
          SMTP_PASS: ci-placeholder
          SMTP_FROM: ci@example.com
        run: pnpm build

      - name: Smoke-boot the bundle
        env:
          PUBLIC_BASE_URL: http://localhost:3000
          PUBLIC_BRAND: Hilo
          ADMIN_EMAIL: ci@example.com
          AUTH_FIXED_PASSWORD: 1234
          SESSION_SECRET: ci-only-not-secret-very-long-placeholder-string
          SMTP_USER: ci@example.com
          SMTP_PASS: ci-placeholder
          SMTP_FROM: ci@example.com
          DATABASE_PATH: ./ci-data/hilo.db
          UPLOAD_DIR: ./ci-uploads
        run: |
          node build/index.js &
          PID=$!
          # wait for the server to listen
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/h.json; then
              break
            fi
            sleep 0.5
          done
          cat /tmp/h.json
          test "$(jq -r .status /tmp/h.json)" = "ok"
          kill $PID
