<!doctype html>
<html lang="en" data-theme="%hilo.theme%" data-accent="%hilo.accent%">
	<head>
		<meta charset="utf-8" />
		<!-- Preload the favicon SVG — it's the LCP element on /login -->
		<link rel="preload" href="%sveltekit.assets%/favicon.svg" as="image" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/logo-192.png" sizes="192x192" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
		<meta name="description" content="Hilo — feedback & support, simply." />

		<!-- iOS PWA · standalone display when added to Home Screen -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Hilo" />

		<!-- Prevent iOS auto-linking phone numbers in ticket bodies -->
		<meta name="format-detection" content="telephone=no" />

		<!-- iOS prefers a 180×180 touch icon. We ship both that and the 192. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180.png" sizes="180x180" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/logo-192.png" sizes="192x192" />

		<!-- Windows tile (Edge / pinned Start menu) -->
		<meta name="msapplication-TileColor" content="#0b0f1a" />
		<meta name="msapplication-TileImage" content="%sveltekit.assets%/logo-256.png" />

		<!-- OpenGraph / Twitter share cards. Real artwork at /og-card.png. -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Hilo — feedback & support, simply" />
		<meta
			property="og:description"
			content="Lightweight self-hosted ticket + chat with magic-link emails. Open source, SQLite-only."
		/>
		<meta property="og:image" content="%sveltekit.assets%/og-card.png" />
		<meta property="og:image:width" content="1536" />
		<meta property="og:image:height" content="1024" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Hilo — feedback & support, simply" />
		<meta
			name="twitter:description"
			content="Lightweight self-hosted ticket + chat with magic-link emails. Open source, SQLite-only."
		/>
		<meta name="twitter:image" content="%sveltekit.assets%/og-card.png" />

		<title>Hilo</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="font-sans">
		<div id="app-root" class="min-h-screen">%sveltekit.body%</div>
	</body>
</html>
