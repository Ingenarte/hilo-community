# docker-compose.local.yml
# Local staging stack — isolated environment for e2e testing.
# Run alongside pnpm dev for full-stack feel, or use directly.
#
# Usage:
#   pnpm stage:up        # build + start at http://localhost:3001
#   pnpm stage:seed      # populate test accounts + tickets
#   pnpm stage:reset     # wipe DB and re-seed
#   pnpm stage:down      # stop
#
# NEVER use -f docker-compose.production.yml alongside this file.
services:
  hilo-local:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_BASE_URL: "http://localhost:3001"
    container_name: hilo-local
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: "3000"
      PUBLIC_BASE_URL: "http://localhost:3001"
      PUBLIC_BRAND: "Hilo (local)"
      # Staging-only admin account — never used in prod.
      # Must be a valid email format (passes server-side regex).
      ADMIN_EMAIL: "admin@local.test"
      AUTH_FIXED_PASSWORD: "admin-local-pw"
      AUTH_DYNAMIC_FORMAT: "none"
      SESSION_SECRET: "local-dev-only-not-secure-do-not-use-in-prod-xxxxxxxxxxx"
      DATABASE_PATH: "/data/hilo.db"
      # SMTP_DRYRUN=1 activates MemoryMailer — no real emails sent from staging.
      SMTP_DRYRUN: "1"
      SMTP_USER: "staging@local.invalid"
      SMTP_PASS: "staging-dummy-password"
      MAX_UPLOAD_MB: "20"
    volumes:
      - hilo-local-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  hilo-local-data:
